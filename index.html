
<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vocabulary Master - 英文單字快速複習</title>
    <!-- Tailwind CSS CDN 依然保留，用於開發便利 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* ── Screen-fit tokens ─────────────────────────────────────────────
         Game screens are single-screen interactions (no scrolling) for a child on a tablet,
         phone or desktop. Big visuals (monster art, word, paddings, option buttons, letter
         tiles) use these tokens via Tailwind arbitrary values, e.g. p-[var(--fit-pad)],
         text-[length:var(--fit-word)].
         They are FLUID: clamp(min, a share of the visible height or width, max), so a bigger
         screen simply gets bigger pieces instead of the stepped shrinking used before (which
         left tablets with a small card, a small monster and empty margins). Landscape screens
         lay the learn / quiz screens out in two columns, so they can use much bigger pieces
         than the stacked portrait layout. dvh = visible height without browser bars. */
      :root {
        /* default = landscape tablets, laptops, desktops */
        --fit-pad: clamp(.75rem, 3.5dvh, 2.5rem);   --fit-pad-sm: clamp(.6rem, 3dvh, 2rem);
        --fit-box: clamp(.6rem, 2.4dvh, 1.5rem);
        --fit-gap: clamp(.6rem, 3dvh, 2rem);        --fit-mb: clamp(.4rem, 2dvh, 1.5rem);
        --fit-monster: clamp(4rem, min(40dvh, 31vw), 24rem);
        --fit-monster-l: clamp(6rem, min(62dvh, 36vw), 30rem);
        --fit-word: clamp(2rem, min(11dvh, 7vw), 6.5rem);
        --fit-zh: clamp(1.5rem, min(7dvh, 4.6vw), 4rem);
        --fit-body: clamp(1rem, min(3.2dvh, 2.2vw), 1.9rem);
        --fit-sent: clamp(1.2rem, min(5.2dvh, 3.4vw), 3rem);
        --fit-opt-pad: clamp(.5rem, 2.4dvh, 1.6rem);
        --fit-opt-min: clamp(3.2rem, 15dvh, 9rem);
        --fit-opt-row: clamp(5rem, 28dvh, 13rem);
        --fit-opt-font: clamp(1.2rem, min(5.2dvh, 3.4vw), 3rem);
        --fit-btn-py: clamp(.5rem, 2.2dvh, 1.5rem);
        --fit-btn-font: clamp(1.2rem, 4.6dvh, 2.4rem);
        --fit-tile-w: clamp(2rem, min(11dvh, 7.5vw), 6rem);
        --fit-tile-h: clamp(2.4rem, min(12.5dvh, 8.5vw), 6.75rem);
        --fit-tile-font: clamp(1.2rem, min(6.5dvh, 4.5vw), 3.6rem);
      }
      /* Portrait tablets: one column, so the height is shared by the pieces. */
      @media (orientation: portrait) {
        :root {
          --fit-pad: clamp(.75rem, 2.6dvh, 2.5rem);  --fit-pad-sm: clamp(.6rem, 2.2dvh, 2rem);
          --fit-box: clamp(.6rem, 1.8dvh, 1.5rem);
          --fit-gap: clamp(.6rem, 2.2dvh, 2rem);     --fit-mb: clamp(.4rem, 1.6dvh, 1.5rem);
          --fit-monster: clamp(4rem, min(20dvh, 38vw), 16rem);
          --fit-monster-l: clamp(6rem, min(30dvh, 58vw), 24rem);
          --fit-word: clamp(2rem, min(7dvh, 12vw), 6rem);
          --fit-zh: clamp(1.5rem, min(4.5dvh, 8vw), 3.5rem);
          --fit-body: clamp(1rem, min(2.4dvh, 3.8vw), 1.8rem);
          --fit-sent: clamp(1.2rem, min(3.6dvh, 5.6vw), 2.6rem);
          --fit-opt-pad: clamp(.5rem, 1.8dvh, 1.5rem);
          --fit-opt-min: clamp(3.2rem, 10dvh, 8rem);
          --fit-opt-font: clamp(1.2rem, min(3.6dvh, 5.6vw), 2.6rem);
          --fit-btn-py: clamp(.5rem, 1.8dvh, 1.4rem);
          --fit-btn-font: clamp(1.2rem, 3.4dvh, 2.2rem);
          --fit-tile-w: clamp(2rem, min(7.5dvh, 12vw), 5.5rem);
          --fit-tile-h: clamp(2.4rem, min(8.5dvh, 13vw), 6rem);
          --fit-tile-font: clamp(1.2rem, min(4.6dvh, 6.5vw), 3.2rem);
        }
      }
      /* Very short landscape windows (a phone on its side): scale the root a little so screens that
         were laid out for taller displays still fit. Tablets are NOT shrunk: the fluid tokens above
         already fit them, and a smaller root made everything small for the child. */
      @media (min-width: 768px) and (max-height: 560px) {
        html {
          font-size: clamp(12px, calc(100vh / 46), 16px);
          font-size: clamp(12px, calc(100dvh / 46), 16px);
        }
      }
      /* Phones (portrait). Tailwind sizes are rem-based, so scaling the root font size shrinks
         every screen in proportion to the available height (short phones get smaller UI, tall
         phones stay close to normal size). dvh = the visible height without browser bars. */
      @media (max-width: 767px) {
        html {
          font-size: clamp(11px, calc(100vh / 58), 16px);
          font-size: clamp(11px, calc(100dvh / 58), 16px);
        }
        /* No phone-only token set any more: the fluid portrait tokens above fit phones too. */
      }
    </style>

{
